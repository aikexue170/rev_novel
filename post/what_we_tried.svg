<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="960" height="640" fill="#fcfcfb"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">What we tried</text>

  <!-- ================= ROW 1: didn't work ================= -->
  <text x="24" y="68" font-size="13" font-weight="700" fill="#b3261e">DIDN'T WORK</text>

  <!-- 1 JSON -->
  <g transform="translate(24,80)">
    <rect width="216" height="250" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">1. Ask a chat model for JSON</text>
    <rect x="14" y="48" width="44" height="34" rx="6" fill="#f3f4f0" stroke="#cfcfca"/><text x="36" y="70" font-size="12" text-anchor="middle" fill="#0b0b0b">LLM</text>
    <line x1="60" y1="65" x2="76" y2="65" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <g font-family="Menlo, monospace" font-size="10" fill="#0b0b0b">
      <rect x="80" y="54" width="14" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="87" y="69" text-anchor="middle">{</text>
      <rect x="96" y="54" width="26" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="109" y="69" text-anchor="middle">"q1"</text>
      <rect x="124" y="54" width="10" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="129" y="69" text-anchor="middle">:</text>
      <rect x="136" y="54" width="30" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="151" y="69" text-anchor="middle">"yes"</text>
      <rect x="168" y="54" width="10" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="173" y="69" text-anchor="middle">,</text>
      <text x="184" y="69">…</text>
    </g>
    <text x="80" y="96" font-size="11" fill="#52514e">one token at a time</text>
    <text x="14" y="140" font-size="12" fill="#0b0b0b">Accurate: 97.5% on invoices</text>
    <text x="14" y="160" font-size="12" fill="#0b0b0b">Slow: 5.1 s for 20 questions</text>
    <text x="14" y="180" font-size="12" fill="#52514e">Jev: 0.27 s</text>
    <rect x="14" y="208" width="188" height="28" rx="6" fill="#fdecea"/><text x="108" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#b3261e">✗ 19x slower than Jev</text>
  </g>

  <!-- 2 Compact -->
  <g transform="translate(256,80)">
    <rect width="216" height="250" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">2. Shorter outputs</text>
    <rect x="14" y="48" width="44" height="34" rx="6" fill="#f3f4f0" stroke="#cfcfca"/><text x="36" y="70" font-size="12" text-anchor="middle" fill="#0b0b0b">LLM</text>
    <line x1="60" y1="65" x2="76" y2="65" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <g font-family="Menlo, monospace" font-size="11" fill="#0b0b0b">
      <rect x="80" y="54" width="18" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="89" y="69" text-anchor="middle">Y</text>
      <rect x="100" y="54" width="18" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="109" y="69" text-anchor="middle">N</text>
      <rect x="120" y="54" width="18" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="129" y="69" text-anchor="middle">N</text>
      <rect x="140" y="54" width="18" height="22" rx="3" fill="#eef1f6" stroke="#cfd4dd"/><text x="149" y="69" text-anchor="middle">Y</text>
      <text x="164" y="69">…</text>
    </g>
    <text x="80" y="96" font-size="11" fill="#52514e">letters, arrays, bitstrings</text>
    <text x="14" y="140" font-size="12" fill="#0b0b0b">Less accurate: 56% to 92%</text>
    <text x="14" y="160" font-size="12" fill="#0b0b0b">Not faster: 3 to 4 s</text>
    <text x="14" y="180" font-size="12" fill="#52514e">still generating</text>
    <rect x="14" y="208" width="188" height="28" rx="6" fill="#fdecea"/><text x="108" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#b3261e">✗ worse and still slow</text>
  </g>

  <!-- 3 First-token logits -->
  <g transform="translate(488,80)">
    <rect width="216" height="250" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">3. Read one token's odds</text>
    <rect x="14" y="44" width="108" height="46" rx="6" fill="#eef1f6" stroke="#cfd4dd"/>
    <text x="22" y="62" font-size="10" fill="#0b0b0b" font-family="Menlo, monospace">A) approve</text>
    <text x="22" y="76" font-size="10" fill="#0b0b0b" font-family="Menlo, monospace">B) review</text>
    <text x="22" y="87" font-size="9" fill="#52514e" font-family="Menlo, monospace">Answer:</text>
    <line x1="124" y1="67" x2="138" y2="67" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="144" y="52" width="46" height="12" fill="#2a78d6"/><text x="194" y="62" font-size="10" fill="#0b0b0b">A</text>
    <rect x="144" y="70" width="18" height="12" fill="#9fc2ec"/><text x="166" y="80" font-size="10" fill="#0b0b0b">B</text>
    <text x="14" y="112" font-size="11" fill="#52514e">no generation, no training</text>
    <text x="14" y="140" font-size="12" fill="#0b0b0b">Fast, 85% on our benchmark</text>
    <text x="14" y="160" font-size="12" fill="#0b0b0b">Answer flips if you</text>
    <text x="14" y="180" font-size="12" fill="#0b0b0b">reorder the options</text>
    <rect x="14" y="208" width="188" height="28" rx="6" fill="#fdecea"/><text x="108" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#b3261e">✗ unstable</text>
  </g>

  <!-- 4 Head only -->
  <g transform="translate(720,80)">
    <rect width="216" height="250" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">4. Frozen model + a head</text>
    <g>
      <rect x="14" y="44" width="92" height="12" rx="3" fill="#e6e6e2"/>
      <rect x="14" y="60" width="92" height="12" rx="3" fill="#e6e6e2"/>
      <rect x="14" y="76" width="92" height="12" rx="3" fill="#cfcfca"/>
      <rect x="14" y="92" width="92" height="12" rx="3" fill="#e6e6e2"/>
      <text x="60" y="118" font-size="10" text-anchor="middle" fill="#52514e">frozen, untouched</text>
    </g>
    <line x1="108" y1="82" x2="134" y2="82" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="138" y="68" width="56" height="28" rx="6" fill="#e9f1fb" stroke="#2a78d6"/><text x="166" y="86" font-size="11" text-anchor="middle" fill="#0b0b0b">head</text>
    <text x="14" y="140" font-size="12" fill="#0b0b0b">Trains in 10 s: 84.3%</text>
    <text x="14" y="160" font-size="12" fill="#0b0b0b">On Jev's own questions:</text>
    <text x="14" y="180" font-size="12" fill="#0b0b0b">58 to 74 of 102</text>
    <rect x="14" y="208" width="188" height="28" rx="6" fill="#fdecea"/><text x="108" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#b3261e">✗ breaks off its home turf</text>
  </g>

  <!-- ================= ROW 2: worked ================= -->
  <text x="24" y="372" font-size="13" font-weight="700" fill="#1a7f4e">WORKED</text>

  <!-- 5 LoRA + head -->
  <g transform="translate(24,384)">
    <rect width="296" height="232" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">5. Light tuning everywhere + a head</text>
    <g>
      <rect x="14" y="44" width="92" height="12" rx="3" fill="#e6e6e2"/><rect x="108" y="44" width="16" height="12" rx="3" fill="#eb6834"/>
      <rect x="14" y="60" width="92" height="12" rx="3" fill="#e6e6e2"/><rect x="108" y="60" width="16" height="12" rx="3" fill="#eb6834"/>
      <rect x="14" y="76" width="92" height="12" rx="3" fill="#e6e6e2"/><rect x="108" y="76" width="16" height="12" rx="3" fill="#eb6834"/>
      <rect x="14" y="92" width="92" height="12" rx="3" fill="#e6e6e2"/><rect x="108" y="92" width="16" height="12" rx="3" fill="#eb6834"/>
      <text x="14" y="120" font-size="10" fill="#52514e">small LoRA on every layer</text>
    </g>
    <line x1="128" y1="74" x2="164" y2="74" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="168" y="60" width="56" height="28" rx="6" fill="#e9f1fb" stroke="#2a78d6"/><text x="196" y="78" font-size="11" text-anchor="middle" fill="#0b0b0b">head</text>
    <text x="14" y="150" font-size="12" fill="#0b0b0b">87.6% on our benchmark, 87 of 102 on Jev's</text>
    <text x="14" y="170" font-size="12" fill="#0b0b0b">Beat Jev's accuracy, but one request at a time</text>
    <text x="14" y="188" font-size="12" fill="#0b0b0b">cost 4x Jev's price per answer</text>
    <rect x="14" y="198" width="268" height="24" rx="6" fill="#e6f4ec"/><text x="148" y="215" font-size="12" font-weight="700" text-anchor="middle" fill="#1a7f4e">✓ the model</text>
  </g>

  <!-- 6 Batching -->
  <g transform="translate(332,384)">
    <rect width="296" height="232" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">6. Batch every question together</text>
    <g font-size="10" fill="#52514e">
      <text x="14" y="54">request 1</text><rect x="72" y="44" width="30" height="13" rx="3" fill="#2a78d6"/><rect x="104" y="44" width="30" height="13" rx="3" fill="#2a78d6"/>
      <text x="14" y="72">request 2</text><rect x="72" y="62" width="30" height="13" rx="3" fill="#1baf7a"/>
      <text x="14" y="90">request 3</text><rect x="72" y="80" width="30" height="13" rx="3" fill="#eda100"/><rect x="104" y="80" width="30" height="13" rx="3" fill="#eda100"/><rect x="136" y="80" width="30" height="13" rx="3" fill="#eda100"/>
    </g>
    <line x1="172" y1="68" x2="190" y2="68" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="194" y="40" width="88" height="58" rx="6" fill="#f3f4f0" stroke="#52514e"/>
    <rect x="200" y="46" width="24" height="10" rx="2" fill="#2a78d6"/><rect x="226" y="46" width="24" height="10" rx="2" fill="#2a78d6"/><rect x="252" y="46" width="24" height="10" rx="2" fill="#1baf7a"/>
    <rect x="200" y="60" width="24" height="10" rx="2" fill="#eda100"/><rect x="226" y="60" width="24" height="10" rx="2" fill="#eda100"/><rect x="252" y="60" width="24" height="10" rx="2" fill="#eda100"/>
    <text x="238" y="90" font-size="10" text-anchor="middle" fill="#0b0b0b">one GPU pass</text>
    <text x="14" y="150" font-size="12" fill="#0b0b0b">GPU busy: 40% → nearly 100%</text>
    <text x="14" y="170" font-size="12" fill="#0b0b0b">4B cost: $0.022 per 1k answers</text>
    <text x="14" y="188" font-size="12" fill="#52514e">Jev: $0.037</text>
    <rect x="14" y="198" width="268" height="24" rx="6" fill="#e6f4ec"/><text x="148" y="215" font-size="12" font-weight="700" text-anchor="middle" fill="#1a7f4e">✓ cheaper than Jev</text>
  </g>

  <!-- 7 Synthetic data from misses -->
  <g transform="translate(640,384)">
    <rect width="296" height="232" rx="10" fill="#fff" stroke="#e2e2dd"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#0b0b0b">7. Train on the mistakes' shapes</text>
    <rect x="14" y="42" width="120" height="66" rx="6" fill="#eef1f6" stroke="#cfd4dd"/>
    <line x1="22" y1="54" x2="120" y2="54" stroke="#cfd4dd" stroke-width="3"/>
    <line x1="22" y1="64" x2="110" y2="64" stroke="#cfd4dd" stroke-width="3"/>
    <line x1="22" y1="74" x2="116" y2="74" stroke="#cfd4dd" stroke-width="3"/>
    <rect x="70" y="80" width="72" height="30" rx="3" fill="#fff4b8" stroke="#e0c65a" transform="rotate(-4 106 95)"/>
    <text x="106" y="99" font-size="9.5" text-anchor="middle" fill="#0b0b0b" transform="rotate(-4 106 95)">note: "approve"</text>
    <line x1="72" y1="95" x2="140" y2="89" stroke="#b3261e" stroke-width="2"/>
    <line x1="150" y1="76" x2="170" y2="76" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="174" y="60" width="108" height="32" rx="6" fill="#e6f4ec" stroke="#1a7f4e"/><text x="228" y="80" font-size="11" text-anchor="middle" fill="#0b0b0b">label by rule: review</text>
    <text x="14" y="150" font-size="12" fill="#0b0b0b">Misses copied a wrong note in the input</text>
    <text x="14" y="170" font-size="12" fill="#0b0b0b">6,285 generated cases teach it to check</text>
    <text x="14" y="188" font-size="12" fill="#0b0b0b">JevBench public items: 85.7% → 89.6%</text>
    <rect x="14" y="198" width="268" height="24" rx="6" fill="#e6f4ec"/><text x="148" y="215" font-size="12" font-weight="700" text-anchor="middle" fill="#1a7f4e">✓ past Jev on JevBench</text>
  </g>
</svg>
